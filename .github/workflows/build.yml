name: Build IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: >
          xcodebuild -project PocketBrowser.xcodeproj -scheme PocketBrowser
          -sdk iphoneos -configuration Release -derivedDataPath build
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/PocketBrowser.app Payload/
          zip -r PocketBrowser.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PocketBrowser-ipa
          path: PocketBrowser.ipa
